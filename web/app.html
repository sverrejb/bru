<!doctype html>
<meta charset="utf-8">
<title>WASM POC</title>
<pre id="out">loading wasm…</pre>
<script type="module">
  import init, { bru_init, bru_online } from './pkg/bru_web.js';

  const out = document.getElementById('out');
  const printToDOM = (line) => { out.textContent += `\n${line}`; };

  // ugly hot reload hack 
  const stamp = async () =>
    (await fetch('./pkg/bru_web_bg.wasm', { method: 'HEAD', cache: 'no-store' })).headers.get('last-modified');

  const built = await stamp();
  setInterval(async () => { if (await stamp() !== built) location.reload(); }, 1000);

  const key = () => {
    const stored = localStorage.getItem('bru.key');
    if (stored) return Uint8Array.from(atob(stored), (c) => c.charCodeAt(0));
    const fresh = crypto.getRandomValues(new Uint8Array(32));
    localStorage.setItem('bru.key', btoa(String.fromCharCode(...fresh)));
    return fresh;
  };

  try {
    await init();
    out.textContent = 'binding iroh endpoint…';
    printToDOM(await bru_init(key()));
    printToDOM('reaching relay…');
    await Promise.race([
      bru_online(),
      new Promise((_, reject) => setTimeout(() => reject(new Error('no relay after 15s')), 15_000)),
    ]);
    printToDOM('iroh connection is up');
  } catch (e) {
    printToDOM(`failed: ${e}`);
  }
</script>

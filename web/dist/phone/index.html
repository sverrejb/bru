<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your phone</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../style.css">
</head>

<body class="wide">

    <header>
        <a href="/">
            <h1>Bru</h1>
        </a>
    </header>

    <h2>Your phone</h2>
    <p id="healthError" class="error" hidden></p>
    <div class="layout">

        <main>
            <div class="card" id="messagesUI">
                <div class="messages-layout">
                    <ul id="threadList" class="thread-list"></ul>
                    <div class="message-column">
                        <ul id="messageList">
                            <li class="loader-row"><span class="loader"></span></li>
                        </ul>
                        <div class="card sendUI">
                            <textarea name="smsBody" id="smsBody" placeholder=""></textarea>
                            <button id="sendBtn" class="btn btn-accent">Send!</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <aside class="sidebar">
            <div class="card">
                <div>
                    <p>Client name: <span id="clientName"></span></p>
                    <p class="id-row">Client id: <span id="clientId" class="id"></span></p>
                </div>
                <hr>
                <div>
                    <p>Phone name: <span id="phoneName"></span></p>
                    <p class="id-row">Phone id: <span id="phoneId" class="id">none</span></p>
                </div>

                <button id="clearBtn" class="btn">Clear all data</button>
            </div>
            <div class="card">
                TODO: Two-way copypaste
            </div>
        </aside>
    </div>

    <template id="threadRowTpl">
        <li class="thread-row">
            <div class="thread-name"></div>
            <div class="thread-preview"></div>
        </li>
    </template>

    <template id="messageRowTpl">
        <li class="message-row">
            <div class="message-body"></div>
            <div class="message-meta"></div>
        </li>
    </template>

    <footer>
    <p>Made in Norway 🇳🇴</p>
    <ul class="footer-links">
      <li>
        <a href="https://github.com/sverrejb/bru" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18l-6-6 6-6M15 6l6 6-6 6" />
          </svg>
          GitHub
        </a>
      </li>
      <li>
        <a href="https://bsky.app/profile/example.bsky.social" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M5.202 2.857C7.954 4.922 10.913 9.11 12 11.358c1.087-2.247 4.046-6.436 6.798-8.501C20.783 1.366 24 .213 24 3.883c0 .732-.42 6.156-.667 7.037-.856 3.061-3.978 3.842-6.755 3.37 4.854.826 6.089 3.562 3.422 6.299-5.065 5.196-7.28-1.304-7.847-2.97-.104-.305-.152-.448-.153-.327 0-.121-.05.022-.153.327-.568 1.666-2.782 8.166-7.847 2.97-2.667-2.737-1.432-5.473 3.422-6.3-2.777.473-5.899-.308-6.755-3.369C.42 10.04 0 4.615 0 3.883c0-3.67 3.217-2.517 5.202-1.026" />
          </svg>
          Bluesky
        </a>
      </li>
      <li>
        <a href="mailto:sverrejb@gmail.com">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="M3 7l9 6 9-6" />
          </svg>
          Email
        </a>
      </li>
    </ul>
  </footer>
</body>

<script type="module">
    // @ts-check
    /**
     * @typedef {object} Message
     * @property {number} seq
     * @property {number} threadId
     * @property {string} address
     * @property {string | null} displayName
     * @property {string} body
     * @property {number} date
     * @property {'in' | 'out'} direction
     * @property {string} status
     * @property {string} [clientId]
     */
    /** @typedef {Record<string, Message[]>} Threads */

    import { key, phoneKey, phoneName, name, clientId } from '../util.js';
    const clientName = /** @type {HTMLElement} */ (document.getElementById('clientName'));
    const clientIdEl = /** @type {HTMLElement} */ (document.getElementById('clientId'));
    const phoneNameEl = /** @type {HTMLElement} */ (document.getElementById('phoneName'));
    const phoneId = /** @type {HTMLElement} */ (document.getElementById('phoneId'));
    const threadListEl = /** @type {HTMLElement} */ (document.getElementById('threadList'));
    const messageListEl = /** @type {HTMLElement} */ (document.getElementById('messageList'));
    /** @type {HTMLTemplateElement} */
    const threadRowTpl = /** @type {any} */ (document.getElementById('threadRowTpl'));
    /** @type {HTMLTemplateElement} */
    const messageRowTpl = /** @type {any} */ (document.getElementById('messageRowTpl'));
    /** @type {HTMLTextAreaElement} */
    const smsBody = /** @type {any} */ (document.getElementById('smsBody'));

    import init, { bru_init, bru_health, get_messages, send_message } from '../pkg/bru_web.js';

    if (!phoneKey()) {
        window.location.href = "/"
    }

    await init();
    const keyBytes = key();
    await bru_init(keyBytes);

    setId(phoneId, phoneKey());
    setId(clientIdEl, clientId());
    phoneNameEl.textContent = phoneName();
    clientName.textContent = name();

    /** @type {HTMLElement} */ (document.getElementById('clearBtn')).onclick = clearData;
    /** @type {HTMLElement} */ (document.getElementById('sendBtn')).onclick = sendMessage;
    smsBody.onkeydown = (e) => {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) sendMessage();
    };


    /** @type {HTMLElement | undefined} */
    let selectedRow;
    /** @type {{name?: string, number: string} | undefined} */
    let selectedContact;

    checkHealth();

    const threads = await getMessages();

    renderMessagesUI();

    console.log(threads);

    //FUNCTIONS BELOW HERE

    function renderMessagesUI() {
        const lastMessages = Object.values(threads)
            .map(msgs => msgs[msgs.length - 1])
            .sort((a, b) => b.date - a.date);

        if (lastMessages.length === 0) {
            messageListEl.textContent = 'No messages yet. Try refreshing in a little while. If that does not work, delete data and try again.';
            return;
        }

        threadListEl.onclick = (e) => {
            const row = /** @type {Element} */ (e.target).closest('.thread-row');
            if (row) selectThread(/** @type {HTMLElement} */ (row));
        };

        renderList(threadListEl, threadRowTpl, lastMessages, (node, last) => {
            /** @type {HTMLElement} */ (node.querySelector('.thread-row')).dataset.threadId = String(last.threadId);
            /** @type {HTMLElement} */ (node.querySelector('.thread-name')).textContent = resolveDisplayName(threads[last.threadId]) || last.address;
            /** @type {HTMLElement} */ (node.querySelector('.thread-preview')).textContent = last.body;
        });

        selectThread(/** @type {HTMLElement} */ (threadListEl.querySelector('.thread-row')));
    }

    /** @param {HTMLElement} row */
    function selectThread(row) {
        selectedRow?.classList.remove('selected');
        selectedRow = row;
        selectedRow.classList.add('selected');
        const messages = threads[/** @type {string} */ (row.dataset.threadId)];
        const last = messages[messages.length - 1];
        selectedContact = { name: resolveDisplayName(messages), number: last.address };
        smsBody.placeholder = `Send SMS to ${selectedContact.name || selectedContact.number}`;
        renderMessages(messages);
    }

    /**
     * @param {Message[]} messages
     * @returns {string | undefined}
     */
    function resolveDisplayName(messages) {
        for (let i = messages.length - 1; i >= 0; i--) {
            if (messages[i].direction === 'in' && messages[i].displayName) return messages[i].displayName;
        }
        return undefined;
    }

    /** @param {Message[]} messages */
    function renderMessages(messages) {
        messageListEl.innerHTML = '';
        renderList(messageListEl, messageRowTpl, messages, (node, message) => {
            /** @type {HTMLElement} */ (node.querySelector('.message-row')).classList.add(message.direction);
            /** @type {HTMLElement} */ (node.querySelector('.message-body')).textContent = message.body;
            /** @type {HTMLElement} */ (node.querySelector('.message-meta')).textContent = new Date(message.date).toLocaleString();
        });
        messageListEl.scrollTop = messageListEl.scrollHeight;
    }

    /**
     * @template T
     * @param {HTMLElement} container
     * @param {HTMLTemplateElement} template
     * @param {T[]} items
     * @param {(node: DocumentFragment, item: T) => void} populate
     */
    function renderList(container, template, items, populate) {
        items.forEach(item => {
            const node = /** @type {DocumentFragment} */ (template.content.cloneNode(true));
            populate(node, item);
            container.appendChild(node);
        });
    }

    /** @returns {Promise<Threads>} */
    async function getMessages() {
        /** @type {Message[]} */
        const cached = JSON.parse(localStorage.getItem('bru.messages') ?? '[]');
        let since = Number(localStorage.getItem('bru.messageCursor') ?? 0);
        const pk = phoneKey();
        let page;

        do {
            page = JSON.parse(await get_messages(pk, since, 500));
            cached.push(...page.messages);
            since = page.cursor;
        } while (page.hasMore);

        localStorage.setItem('bru.messages', JSON.stringify(cached));
        localStorage.setItem('bru.messageCursor', String(since));

        /** @type {Threads} */
        const threads = {};
        cached.forEach(m => (threads[m.threadId] ??= []).push(m));
        return threads;
    }


    async function checkHealth() {
        const healthError = /** @type {HTMLElement} */ (document.getElementById('healthError'));
        try {
            const health = JSON.parse(await bru_health(phoneKey()));
            if (health.status !== 'ok') {
                healthError.textContent = `Phone reported status: ${health.status}`;
                healthError.hidden = false;
            }
        } catch (e) {
            healthError.textContent = 'Could not reach phone.';
            healthError.hidden = false;
        }
    }

    /**
     * @param {HTMLElement} el
     * @param {string | null} id
     */
    function setId(el, id) {
        el.textContent = id;
        el.title = id;
    };

    function clearData() {
        if (confirm("Clear all Bru-related data off this browser?")) {
            localStorage.clear();
            window.location.href = "/"
        }
    }

    async function sendMessage() {
        console.log(smsBody);
        if (!smsBody.value){
            return
        }
        const idempotency_guid = crypto.randomUUID();
        await send_message(phoneKey(), selectedContact.number, smsBody.value, idempotency_guid);
        smsBody.value = "";
    }


</script>

</html>

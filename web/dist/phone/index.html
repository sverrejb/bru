<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <title>Your phone — Bru</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="./phone.js"></script>
    <script type="module" src="/components/header.js"></script>
    <script type="module" src="/components/footer.js"></script>
</head>

<body class="wide">

    <site-header></site-header>

    <p id="healthError" class="error" role="alert" hidden></p>
    <p id="cacheWarning" class="error" aria-live="polite" hidden></p>
    <div class="layout">

        <main>
            <h1 class="visually-hidden">Your phone</h1>
            <div class="card" id="messagesUI">
                <div class="messages-layout">
                    <div class="thread-column">
                        <h2 class="visually-hidden">Conversations</h2>
                        <ul id="threadList" class="thread-list"></ul>
                        <button id="newBtn" class="btn btn-accent">New message ✉️</button>
                    </div>
                    <div class="message-column">
                        <h2 class="visually-hidden">Messages</h2>
                        <ul id="messageList" tabindex="0" aria-label="Messages">
                            <li class="loader-row"><span class="loader"></span></li>
                        </ul>
                        <div class="card sendUI">
                            <textarea name="smsBody" id="smsBody" placeholder="" aria-label="Message"></textarea>
                            <button id="sendBtn" class="btn btn-accent">Send!</button>
                        </div>
                        <dialog id="newMsgModal" aria-labelledby="newMsgTitle">
                            <form method="dialog">
                                <h2 id="newMsgTitle">New message</h2>
                                <label for="newMsgInput">Recipient's phone number:</label>
                                <input type="tel" id="newMsgInput" autocomplete="tel" required />
                                <button id="newMsgSubmit" class="btn btn-accent" value="default">OK</button>
                            </form>
                        </dialog>
                    </div>
                </div>
            </div>
        </main>

        <aside class="sidebar">
            <div class="card">
                <h2 class="card-title">Settings<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor"
                        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
                        <circle cx="12" cy="12" r="3" />
                    </svg>
                </h2>
                <p>Client name: <span id="clientName"></span></p>
                <p>Phone name: <span id="phoneName"></span></p>
                <label class="toggle">
                    <input type="checkbox" id="notifyToggle">
                    Notify me of new messages
                </label>
                <p id="notifyDenied" class="error" aria-live="polite" hidden>Notifications are blocked in your browser settings.</p>

                <button id="clearBtn" class="btn">Clear all data</button>
            </div>
            <div class="card">
                <h2 class="card-title" id="clipLbl">Clipboard<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor"
                        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
                    </svg>
                </h2>
                <textarea id="clipboardText" aria-labelledby="clipLbl" placeholder="Paste text or an image here"></textarea>
                <div id="clipboardImageBox" hidden>
                    <img id="clipboardImage" alt="Clipboard image">
                    <button id="clearClipboardBtn" class="clipboard-clear" aria-label="Remove image">✕</button>
                </div>
                <div class="clipboard-actions">
                    <button id="copyClipboardBtn" class="btn btn-info">Copy</button>
                    <button id="sendClipboardBtn" class="btn btn-accent">Send to phone</button>
                </div>
                <p id="clipboardStatus" class="error" role="alert" hidden></p>
            </div>
            <div class="card">
                <h2 class="card-title" id="filesLbl">Files<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor"
                        stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
                        <path d="M14 2v4a2 2 0 0 0 2 2h4" />
                    </svg>
                </h2>
                <label id="dropZone" class="drop-zone">
                    <input type="file" id="fileInput" multiple>
                    <span id="dropPrompt">Drop a file or <u>browse</u></span>
                    <span id="dropProgress" hidden></span>
                </label>
                <ul id="fileList" class="file-list" aria-labelledby="filesLbl"></ul>
                <p id="fileStatus" class="error" role="alert" hidden></p>
            </div>
        </aside>
    </div>


    <template id="threadRowTpl">
        <li>
            <button type="button" class="thread-row">
                <div class="thread-name"></div>
                <div class="thread-preview"></div>
            </button>
        </li>
    </template>

    <template id="messageRowTpl">
        <li class="message-row">
            <div class="message-body"></div>
            <div class="message-meta"></div>
        </li>
    </template>

    <template id="fileRowTpl">
        <li class="file-row">
            <span class="file-name"></span>
            <a class="btn btn-info" download>Download</a>
            <button type="button" class="btn btn-danger">Clear</button>
        </li>
    </template>

    <p id="liveAnnounce" class="visually-hidden" aria-live="polite"></p>

    <site-footer></site-footer>
</body>

</html>

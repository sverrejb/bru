<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your phone</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body class="wide">
    <h1>Your phone</h1>
    <div class="layout">
        

        <main>
            <div class="card">
                TODO: Implement message UI (the rest of the fucking owl)
            </div>
        </main>

        <aside class="sidebar">
            <div class="card">
                <div>
                    <p>Client name: <span id="clientName"></span></p>
                    <p class="id-row">Client id: <span id="clientId" class="id"></span></p>
                </div>

                <hr>

                <div>
                    <p>Phone name: <span id="phoneName"></span></p>
                    <p class="id-row">Phone id: <span id="phoneId" class="id">none</span></p>
                </div>

                <button id="clearBtn">Clear all data</button>
            </div>
        </aside>
    </div>
</body>

<script type="module">
    import { key, phoneKey, phoneName, name, clientId } from '../util.js';
    const clientName = document.getElementById('clientName');
    const clientIdEl = document.getElementById('clientId');
    const phoneNameEl = document.getElementById('phoneName');
    const phoneId = document.getElementById('phoneId');

    import init, { bru_health, bru_init } from '../pkg/bru_web.js';

    await init();
    const keyBytes = key();

    console.log(keyBytes);
    const endpointId = await bru_init(keyBytes);


    const clearBtn = document.getElementById('clearBtn');
    if (!phoneKey()) {
        window.location.href = "/"
    }

    const setId = (el, id) => {
        el.textContent = id;
        el.title = id;
    };

    setId(phoneId, phoneKey());
    setId(clientIdEl, clientId());
    phoneNameEl.textContent = phoneName();
    clientName.textContent = name();

    clearBtn.onclick = () => {
        if (confirm("Delete all data?")) {
            localStorage.clear();
            window.location.href = "/"
        }
    }


    let health = await bru_health(phoneKey());

    console.log("health: ", health)

</script>

</html>

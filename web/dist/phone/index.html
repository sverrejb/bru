<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your phone</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body class="wide">
    <div class="layout">
        <aside class="sidebar">
            <h1>Your phone</h1>
            <div class="card">
                <div>
                    <p>Client name: <span id="clientName"></span></p>
                    <p>Client id: <span id="clientId"></span></p>
                </div>

                <hr>

                <div>
                    <p>Phone name: <span id="phoneName"></span></p>
                    <p>Phone id: <span id="phoneId">none</span></p>
                </div>

                <button id="clearBtn">Clear all data</button>
            </div>
        </aside>

        <main>
            <h2>Messages</h2>
            <div class="card">
                TODO: Implement message UI (the rest of the fucking owl)
            </div>
        </main>
    </div>
</body>

<script type="module">
    import { key, phoneKey, phoneName, name, clientId } from '../util.js';
    const clientName = document.getElementById('clientName');
    const clientIdEl = document.getElementById('clientId');
    const phoneNameEl = document.getElementById('phoneName');
    const phoneId = document.getElementById('phoneId');


    const clearBtn = document.getElementById('clearBtn');
    if (!phoneKey()) {
        window.location.href = "/"
    }
    phoneId.textContent = phoneKey();
    phoneNameEl.textContent = phoneName();
    clientName.textContent = name();
    clientIdEl.textContent = clientId();

    clearBtn.onclick = () => {
        if (confirm("Delete all data?")) localStorage.clear();
        window.location.href = "/"        
    }



</script>

</html>
